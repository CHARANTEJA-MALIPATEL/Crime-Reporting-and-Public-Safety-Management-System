<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SafeCity</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body style="background-color: #f3f4f6;">

    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            <i class="fas fa-shield-alt"></i> SAFECITY
        </a>
        <div class="nav-links">
            <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
            <a href="report.html" class="nav-link"><i class="fas fa-file-alt"></i> Report Crime</a>
            <a href="index.html#about" class="nav-link"><i class="fas fa-info-circle"></i> About</a>
            <a href="index.html#contact" class="nav-link"><i class="fas fa-phone"></i> Contact</a>
            <a href="login.html" class="btn btn-outline small"><i class="fas fa-sign-in-alt"></i> Login</a>
        </div>
    </nav>

    <div style="padding: 2rem 0;">
    <div class="card"
        style="width: 100%; max-width: 500px; margin: auto; padding: 2rem; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <i class="fas fa-user-plus" style="font-size: 3rem; color: #1e3a8a;"></i>
            <h2 style="margin-top: 1rem;">Create Account</h2>
            <p class="text-muted">Join us in making your city safer</p>
        </div>

        <!-- Step 1: Registration Form -->
        <div id="step1">
            <form onsubmit="handleSendEmailOTP(event)">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <div style="position: relative;">
                        <i class="fas fa-user" style="position: absolute; left: 10px; top: 12px; color: #9ca3af;"></i>
                        <input type="text" id="fullName" class="form-control" style="padding-left: 2.5rem;" required
                            placeholder="John Doe">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div style="position: relative;">
                        <i class="fas fa-envelope"
                            style="position: absolute; left: 10px; top: 12px; color: #9ca3af;"></i>
                        <input type="email" id="email" class="form-control" style="padding-left: 2.5rem;" required
                            placeholder="name@example.com">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <div style="position: relative;">
                        <i class="fas fa-phone" style="position: absolute; left: 10px; top: 12px; color: #9ca3af;"></i>
                        <input type="tel" id="phone" class="form-control" style="padding-left: 2.5rem;" required
                            placeholder="+1234567890">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div style="position: relative;">
                        <i class="fas fa-lock" style="position: absolute; left: 10px; top: 12px; color: #9ca3af;"></i>
                        <input type="password" id="password" class="form-control" style="padding-left: 2.5rem;" required
                            placeholder="Create a strong password">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Account Role</label>
                    <div style="position: relative;">
                        <i class="fas fa-id-badge"
                            style="position: absolute; left: 10px; top: 12px; color: #9ca3af;"></i>
                        <select id="role" class="form-control" style="padding-left: 2.5rem;">
                            <option value="citizen">Citizen</option>
                            <option value="admin">Police / Admin (Demo)</option>
                        </select>
                    </div>
                </div>

                <!-- Terms and Conditions Acceptance -->
                <div class="form-group" style="background: #eff6ff; padding: 1rem; border-radius: 8px; border: 1px solid #bfdbfe;">
                    <div style="display: flex; align-items: start; gap: 0.75rem;">
                        <input type="checkbox" id="acceptTerms" required style="margin-top: 0.25rem; width: 18px; height: 18px; cursor: pointer;">
                        <label for="acceptTerms" style="cursor: pointer; font-size: 0.9rem; line-height: 1.5; color: #1e40af;">
                            I have read and agree to the <a href="terms.html" target="_blank" style="font-weight: 600; text-decoration: underline;">Terms and Conditions</a>. 
                            I understand that filing false reports may result in legal consequences and that all individuals are presumed innocent until proven guilty.
                        </label>
                    </div>
                </div>

                <div style="background: #fef2f2; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #dc2626; margin-bottom: 1rem;">
                    <p style="font-size: 0.85rem; color: #991b1b; margin: 0;">
                        <i class="fas fa-exclamation-triangle"></i> <strong>Warning:</strong> False reporting is a criminal offense and may result in prosecution.
                    </p>
                </div>

                <button type="submit" class="btn btn-primary" id="btnSendOTP"
                    style="width: 100%; justify-content: center; padding: 0.75rem;">
                    Send Email OTP
                </button>
            </form>
        </div>

        <!-- Step 2: Email OTP -->
        <div id="step2" style="display:none;">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <h3 style="color: #1e3a8a;">Email Verification</h3>
                <p>Enter the code sent to <span id="displayEmail" style="font-weight: 600;"></span></p>
            </div>
            <form onsubmit="handleVerifyEmailOTP(event)">
                <div class="form-group">
                    <label class="form-label">6-Digit Email Code</label>
                    <div style="position: relative;">
                        <i class="fas fa-key" style="position: absolute; left: 10px; top: 12px; color: #9ca3af;"></i>
                        <input type="text" id="emailOtp" class="form-control"
                            style="padding-left: 2.5rem; text-align: center; font-weight: bold; letter-spacing: 0.3rem;"
                            required maxlength="6" placeholder="000000">
                    </div>
                </div>
                <button type="submit" id="btnVerifyEmail" class="btn btn-primary"
                    style="width: 100%; justify-content: center; padding: 0.75rem;">
                    Verify Email
                </button>
                <div style="text-align: center; margin-top: 1rem;">
                    <button type="button" onclick="showStep1()" class="btn-link">Change Details</button>
                </div>
            </form>
        </div>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
            Already have an account? <a href="login.html" style="font-weight: 600; color: #1e3a8a;">Login</a>
        </div>
        <div style="text-align: center; margin-top: 1rem;">
            <a href="index.html" style="color: #6b7280; font-size: 0.85rem;"><i class="fas fa-arrow-left"></i> Back to
                Home</a>
        </div>
    </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
