<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SafeCity</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body style="background-color: #f3f4f6;">

    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            <i class="fas fa-shield-alt"></i> SAFECITY
        </a>
        <div class="nav-links">
            <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
            <a href="report.html" class="nav-link"><i class="fas fa-file-alt"></i> Report Crime</a>
            <a href="index.html#about" class="nav-link"><i class="fas fa-info-circle"></i> About</a>
            <a href="index.html#contact" class="nav-link"><i class="fas fa-phone"></i> Contact</a>
            <a href="terms.html" class="nav-link"><i class="fas fa-file-contract"></i> Terms</a>
            <a href="register.html" class="btn btn-primary small"><i class="fas fa-user-plus"></i> Register</a>
        </div>
    </nav>

    <div style="display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 80px); padding: 2rem 0;">
    <div class="card"
        style="width: 100%; max-width: 400px; padding: 2rem; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <i class="fas fa-shield-alt" style="font-size: 3rem; color: #1e3a8a;"></i>
            <h2 style="margin-top: 1rem;">Welcome Back</h2>
            <p class="text-muted">Secure Login Portal</p>
        </div>

        <form onsubmit="login(event)">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <div style="position: relative;">
                    <i class="fas fa-envelope" style="position: absolute; left: 10px; top: 12px; color: #9ca3af;"></i>
                    <input type="email" id="email" class="form-control" style="padding-left: 2.5rem;" required
                        placeholder="name@example.com">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <div style="position: relative;">
                    <i class="fas fa-lock" style="position: absolute; left: 10px; top: 12px; color: #9ca3af;"></i>
                    <input type="password" id="password" class="form-control" style="padding-left: 2.5rem;" required
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn btn-primary"
                style="width: 100%; justify-content: center; padding: 0.75rem;">
                Sign In
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
            Don't have an account? <a href="register.html" style="font-weight: 600;">Register here</a>
        </div>
        <div style="text-align: center; margin-top: 1rem;">
            <a href="index.html" style="color: #6b7280; font-size: 0.85rem;"><i class="fas fa-arrow-left"></i> Back to
                Home</a>
        </div>
    </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
